<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container">
        <h1 class="montserrat">facebook</h1>
        <p class="tag-line">Facebook helps you connect and share with the people in your life.</p>
        <div class="box">
            <form>
                <input type="text" placeholder="Email Address or Phone Number" class="input-field" required>
                <input type="password" placeholder="Password" class="input-field" required>
                <button class="login-btn">Log In</button>
                <p class="forgot-password">Forgotten password?</p>
                <hr />
                <button class="create-account-btn">Create New Account</button>
            </form>
        </div>
        <p><span> Create a page</span> for a celebrity, brand or business.</p>
    </div>
</body>

</html>
